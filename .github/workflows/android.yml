name: Build Alpha Pulse Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Find and extract Alpha Pulse project
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE=""

      if [ -f "AlphaPulseResearch.zip" ]; then
        ZIP_FILE="AlphaPulseResearch.zip"
      else
        ZIP_FILE=$(find . -maxdepth 3 -type f \
          -iname 'AlphaPulseResearch.zip' -print -quit)
      fi

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: AlphaPulseResearch.zip not found."
        find . -maxdepth 4 -type f | sort
        exit 1
      fi

      mkdir -p extracted
      unzip -oq "$ZIP_FILE" -d extracted

      PROJECT_DIR=$(find extracted -type f \
        -path '*/app/build.gradle.kts' -print -quit)

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android Gradle project not found."
        find extracted -maxdepth 6 -type f | sort
        exit 1
      fi

      PROJECT_DIR="${PROJECT_DIR%/app/build.gradle.kts}"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project: $PROJECT_DIR"

  - name: Build debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: gradle --no-daemon assembleDebug

  - name: Verify APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -euo pipefail

      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not created."
        find app/build -type f | sort || true
        exit 1
      fi

      echo "APK build successful:"
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: alpha-pulse-research-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
