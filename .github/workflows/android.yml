name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f | sort

      - name: Unzip Android project
        run: |
          set -e

          ZIP_FILE="alpha-chain-monitor-android-v2.zip"
          EXTRACT_DIR="extracted"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found!"
            echo "Available ZIP files:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo ""
          echo "===== Extracted files ====="
          find "$EXTRACT_DIR" -maxdepth 3 -type f | sort

      - name: Find Flutter project
        run: |
          set -e

          PROJECT_DIR="extracted"

          # Handle ZIPs that contain an extra top-level directory.
          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            FOUND=$(find "$PROJECT_DIR" -maxdepth 3 -name "pubspec.yaml" -print -quit)

            if [ -z "$FOUND" ]; then
              echo "ERROR: pubspec.yaml was not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$FOUND")"
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          # Generate missing Android Gradle files.
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Android project not found."
            echo "Generating Android project with Flutter..."

            flutter create \
              --platforms=android \
              --project-name=alpha_chain_monitor \
              .
          else
            echo "Android project already exists."
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpha-chain-monitor-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
