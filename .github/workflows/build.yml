name: Alpha Pump AI - Build Android App

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-android:

    name: Unzip and Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Download repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Show repository contents
      # ---------------------------------------------------------
      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort


      # ---------------------------------------------------------
      # 3. Find the Alpha Pump ZIP
      # ---------------------------------------------------------
      - name: Find Alpha Pump ZIP
        id: find_zip
        shell: bash
        run: |

          set -e

          echo "Searching for Alpha Pump ZIP..."

          ZIP_FILE=$(find . -type f \
            \( \
              -name "alpha_pump_ai_android_realtime_3s.zip" \
              -o \
              -name "alpha_pump_ai_android_complete.zip" \
              -o \
              -name "*.zip" \
            \) \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            echo ""
            echo "Make sure the ZIP file is uploaded to the repository."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 4. Create extraction directory
      # ---------------------------------------------------------
      - name: Prepare extraction directory
        run: |

          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extraction directory created."


      # ---------------------------------------------------------
      # 5. Unzip the project
      # ---------------------------------------------------------
      - name: Unzip Alpha Pump project
        run: |

          set -e

          echo "Unzipping:"
          echo "${{ steps.find_zip.outputs.zip_file }}"

          unzip -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "ZIP successfully extracted."
          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort


      # ---------------------------------------------------------
      # 6. Find Android project
      # ---------------------------------------------------------
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |

          set -e

          echo "Searching for Android project..."

          ANDROID_DIR=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then

            ANDROID_DIR=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -printf '%h\n' \
              | head -n 1)

          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Expected settings.gradle.kts or settings.gradle."
            echo ""
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 7. Show Android project
      # ---------------------------------------------------------
      - name: Show Android project
        run: |

          echo "Android project files:"
          find "${{ steps.android_project.outputs.android_dir }}" \
            -maxdepth 5 \
            -type f \
            | sort


      # ---------------------------------------------------------
      # 8. Install Java
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 9. Install Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 10. Install Android SDK packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ---------------------------------------------------------
      # 11. Install Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # ---------------------------------------------------------
      # 12. Verify Java / Gradle
      # ---------------------------------------------------------
      - name: Check build environment
        run: |

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          adb version || true


      # ---------------------------------------------------------
      # 13. Build Android Debug APK
      # ---------------------------------------------------------
      - name: Build Android Debug APK
        working-directory: ${{ steps.android_project.outputs.android_dir }}
        run: |

          set -e

          echo "Starting Android build..."

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo ""
          echo "BUILD COMPLETE."


      # ---------------------------------------------------------
      # 14. Find APK
      # ---------------------------------------------------------
      - name: Find generated APK
        id: apk
        shell: bash
        run: |

          set -e

          APK=$(find \
            "${{ steps.android_project.outputs.android_dir }}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 15. Upload APK
      # ---------------------------------------------------------
      - name: Upload Alpha Pump APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Pump-AI-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30


      # ---------------------------------------------------------
      # 16. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        run: |

          echo "======================================"
          echo " ALPHA PUMP AI BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "${{ steps.apk.outputs.apk_path }}"
          echo ""
          echo "Go to:"
          echo "GitHub → Actions → this workflow → Artifacts"
          echo ""
          echo "Download:"
          echo "Alpha-Pump-AI-Debug-APK"
